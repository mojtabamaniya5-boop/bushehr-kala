<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>در حال بارگذاری...</title>
    <script>
      // ذخیره آدرس و انتقال به صفحه اصلی با حفظ مسیر
      sessionStorage.redirect = location.href;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
        l.pathname.slice(1).split('/').join('&') +
        (l.search ? '&' + l.search.slice(1).split('&').join('&') : '') +
        l.hash
      );
    </script>
  </head>
  <body>در حال بارگذاری...</body>
</html>
