name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Convert SVG icon to PNG (1024x1024)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p assets
          ls -la public/
          convert -background none -density 300 -resize 1024x1024 public/icon.svg assets/icon.png
          ls -la assets/

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Generate app icons
        run: pnpm dlx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bushehr-kala-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
