name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Convert SVG icon to PNG (using rsvg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 public/icon.svg -o assets/icon.png

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Generate app icons
        run: pnpm dlx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Setup signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/cafetorshi-release.keystore
          ls -la android/app/cafetorshi-release.keystore

          cat >> android/app/build.gradle <<'GRADLE_EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('cafetorshi-release.keystore')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE_EOF

          echo "=== build.gradle tail ==="
          tail -25 android/app/build.gradle

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: cafetorshi-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
