# ============================================================
# کانفیگ Nginx سایت cafetorshi.ir — نسخه سئو (آبان ۱۴۰۵)
#
# مشکل سئویی که این فایل حل می‌کند:
# مقاله‌های تازه بعد از انتشار در پنل ادمین، تا دیپلوی بعدی روی
# آدرس مستقیم (مثل /blog/torshi-anbe-ba-pizza) خطای 404 می‌دادند،
# چون بلاک‌های جداگانه /blog/ و /product/ (نسخه 6.0.2) برای مسیرهای
# ناشناخته fallback نداشتند. در حالی که صفحه مقاله در فرانت (SPA)
# اسلاگ را مستقیم از Supabase می‌خواند (src/pages/Article.jsx) و
# اگر Nginx به index.html برگردد، مقاله تازه بلافاصله با کد 200
# باز می‌شود و نیازی به دیپلوی برای هر مقاله نیست.
# پررندر HTML فقط برای خزنده‌ها و متا تگ‌هاست؛ fallback به SPA
# جای آن را نمی‌گیرد، فقط 404 را به 200 تبدیل می‌کند.
#
# نصب روی سرور (دستی، چون کانفیگ Nginx در ریپو نبود و روی سرور است):
#   1. از کانفیگ فعلی بکاپ بگیرید:
#        sudo cp /etc/nginx/sites-enabled/cafetorshi /root/nginx-cafetorshi.bak
#   2. این فایل را جایگزین کنید (مسیر cert را با مسیر واقعی Certbot
#      روی سرور مقایسه کنید) و تست بگیرید:
#        sudo nginx -t && sudo systemctl reload nginx
#   3. تست: یک مقاله تازه منتشر کنید و قبل از دیپلوی، آدرس مستقیم
#      آن را باز کنید؛ باید 200 بدهد، نه 404.
# ============================================================

server {
    listen 80;
    server_name cafetorshi.ir www.cafetorshi.ir;
    # ریدایرکت به HTTPS (اگر Certbot قبلاً این بلاک را ساخته، همان را نگه دارید)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cafetorshi.ir www.cafetorshi.ir;

    # مسیر گواهی Certbot — اگر روی سرور متفاوت است، همین دو خط را اصلاح کنید
    ssl_certificate /etc/letsencrypt/live/cafetorshi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafetorshi.ir/privkey.pem;

    root /var/www/cafetorshi/docs;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # فایل‌های استاتیک بیلد — کش بلند، چون نام فایل هش دارد
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index اصلی SPA — هرگز کش نشود تا نسخه جدید بلافاصله دیده شود
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # نقشه سایت و robots همیشه فایل واقعی (نه SPA)
    location = /sitemap.xml {
        try_files $uri =404;
    }
    location = /robots.txt {
        try_files $uri =404;
    }

    # مقاله‌ها: اگر پوشه پررندرشده وجود داشت همان سرو می‌شود؛
    # اگر مقاله تازه است و هنوز دیپلوی نشده، SPA باز می‌شود (200)
    # و فرانت مقاله را از Supabase می‌خواند.
    location /blog/ {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # محصولات: مثل بلاگ — صفحه پررندرشده اگر هست، وگرنه SPA
    location /product/ {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # بقیه مسیرهای SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
